name: Security Audit
on:
  schedule:
    - cron: "10 6 15 8 *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set Node.js 12.x
        uses: actions/setup-node@v1.3.0
        with:
          node-version: 12.x
      - name: Install dependencies
        run: npm ci
        working-directory: GitHubActions
      - name: Audit
        run: npm audit
        working-directory: GitHubActions

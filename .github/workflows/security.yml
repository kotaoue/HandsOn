name: Security Audit
on:
  schedule:
    - cron: "10 6 15 8 *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci
        working-directory: GitHubActions
      - name: Audit
        run: npm audit
        working-directory: GitHubActions
